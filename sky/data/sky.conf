# ============================================
#  Sky File Manager Configuration
#  Location: ~/.config/sky/sky.conf
#  Format  : key : value
#  Comments: lines starting with '#', or ' #' after a value
# ============================================

# ─── Colors ──────────────────────────────────
# Core palette. Use #rrggbb or #rgb.
# Leave as '#' (or empty) to use the default.
background_color : #
foreground_color : #
accent_color     : #
accent_color_1   : #
accent_color_2   : #

# File-type specific colors (optional)
# If left blank, color_dir follows accent_color and
# color_symlink follows accent_color_1.
color_dir        : #
color_symlink    : #
color_executable : #
color_hidden     : #
color_error      : #
color_warning    : #
color_success    : #

# ─── Fonts (GUI only) ────────────────────────
# Main UI font (leave blank to use system default)
global_font       : #
# Fallback font for icons / emoji
global_other_font : #

# ─── Shortcuts (GUI only) ────────────────────
# Enable or disable the custom shortcuts below.
# To disable, use: sky.shortcuts : disable
sky.shortcuts : enable

# Format: sky.shortcuts : <key combo> : <action>
# 'super' is the Windows/Meta key. Your window manager may reserve some
# super+... combinations for itself; pick another if one does not work.
#
# Available actions:
#   exit sky       quit the application
#   delete file    move the selected item to the trash (asks first)
#   search files   filter the active panel by name
sky.shortcuts : super+shift+e : exit sky
sky.shortcuts : super+alt+q   : delete file
sky.shortcuts : super+alt+d   : search files

# ─── General ─────────────────────────────────
# Where deleted files are moved (freedesktop.org trash layout)
trash_path : ~/.local/share/Trash/

# Default startup mode
# Options: tui | gui | tui+gui
default_mode : tui

# Directory to open at startup (default: home)
# start_path : ~/Downloads

# Show hidden files (dotfiles) at startup. Toggle at runtime: H (TUI) / Ctrl+H (GUI)
show_hidden : false

# ─── File types ──────────────────────────────
# If true, all files are shown regardless of extension.
# If false, only extensions listed in 'file_types' are shown
# (directories are always shown).
file_types_all : true

# Extensions to show when file_types_all is false
# file_types : .txt , .pdf , .conf , .h , .rs , .png , .jpg , .mp4 , .zip , .tar.gz , .md , .py , .sh , .fish

# ─── Split panels ────────────────────────────
# Dual-pane mode: enable | disable
split : disable
# Position of the second panel relative to the first
# Values: left | right | down | top
split_direction : right
